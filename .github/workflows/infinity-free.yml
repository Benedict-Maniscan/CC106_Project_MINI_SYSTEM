name: Deploy to InfinityFree
on:
  push:
    branches:
      - main # Change to this branch will trigger the publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: FTP Deploy
        uses-on: unbuntu-latest
        steps:
          - name: get latest code
            uses: actions/setup-node@v3

      - name: upload file via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.1.0
        with:
          server: ${{ secrets.ftpupload.net }}
          username: ${{ secrets.if0_42890218 }}
          password: ${{ secrets.Ben07132006 }}
         server-dir:/coder-ems.ifree.page
